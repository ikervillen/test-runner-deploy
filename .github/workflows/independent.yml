name: Independent pipelines validation

on:
  push:
    branches: [develop, release/independent-pipelines-candidate]
  pull_request:
  workflow_dispatch:
    inputs:
      rollout_application:
        description: Activate the application-only deployment from develop
        type: boolean
        default: false

permissions:
  contents: read

env:
  FRONTEND_CONTEXT_COMMIT: a1b9df74927d99a942a54ba0d1d2ed72aae76bcc
  GOLD_CONTEXT_COMMIT: 6eb1676b72c3b2cc62846fb7daad728067d157ab
  GOLD_SOURCE_COMMIT: ad88dc3d0bdedfbc4da3de06da74e3801b9b64f7

jobs:
  contracts-and-delta:
    if: github.event_name != 'push' || github.event.before != 'd789f7c5eda5b1682a2111fce6b1e745e220c2f3'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned uv
        shell: pwsh
        run: |
          "UV_PROJECT_ENVIRONMENT=$env:RUNNER_TEMP/ingesta-delta-venv" >> $env:GITHUB_ENV
          python -m pip install uv==0.11.6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Contracts and real Delta transactions on synthetic inputs
        run: uv run --locked python -m pytest --cov=ingesta_delta_lake --cov=deployment --cov-report=term-missing --cov-fail-under=85

  gold-native-contracts:
    if: github.event_name != 'push' || github.event.before != 'd789f7c5eda5b1682a2111fce6b1e745e220c2f3'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.GOLD_CONTEXT_COMMIT }}
          path: .quality-context
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.6
      - name: Verify source and install locked Gold with native contracts
        working-directory: .quality-context
        shell: pwsh
        run: |
          if ((Get-Content GOLD_REVISION -Raw).Trim() -ne $env:GOLD_SOURCE_COMMIT) { throw 'Gold source differs' }
          uv sync --locked --python 3.12 --extra gold
      - name: Lint and type-check the shared Gold engine
        working-directory: .quality-context
        run: |
          uv run --locked --extra gold ruff check backend
          uv run --locked --extra gold ruff format --check backend
          uv run --locked --extra gold mypy
      - name: Real Gold publications and cross-lane metrics with native contracts
        working-directory: .quality-context
        run: uv run --locked --python 3.12 --extra gold --with-editable .. python -m pytest backend/tests --tb=short -q --junitxml=independent-gold.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: independent-gold-${{ matrix.os }}
          path: .quality-context/independent-gold.xml

  independent-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rollout: ${{ steps.bundle.outputs.rollout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.GOLD_CONTEXT_COMMIT }}
          path: .quality-context
          persist-credentials: false
      - name: Verify the pinned source
        run: test "$(cat .quality-context/GOLD_REVISION)" = "$GOLD_SOURCE_COMMIT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.independent
          build-contexts: quality=.quality-context
          platforms: linux/amd64
          load: true
          push: false
          tags: fenix-independent:validation
          build-args: |
            REVISION=${{ github.sha }}
            GOLD_REVISION=${{ env.GOLD_CONTEXT_COMMIT }}
          cache-from: type=gha,scope=independent
          cache-to: type=gha,scope=independent,mode=max
      - name: Check final entrypoints without operational mounts or network
        shell: bash
        run: |
          set -euo pipefail
          image=fenix-independent:validation
          # Match the deployed read-only root plus writable, ephemeral scratch mount.
          candidate=(docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,noexec,nosuid,size=64m)
          "${candidate[@]}" "$image" --help
          "${candidate[@]}" --entrypoint python "$image" -m app.gold.independent_runtime --help
          "${candidate[@]}" --entrypoint python "$image" -m app.gold.evidence_storage --help
          "${candidate[@]}" --entrypoint python "$image" -m app.gold.storage_audit --help
          "${candidate[@]}" --entrypoint python "$image" -m deployment.independent --help
          "${candidate[@]}" --entrypoint python "$image" -c 'import importlib.metadata as m; from app.factory import create_app; from ingesta_delta_lake.pipeline_runtime import PipelineWorker; assert m.version("deltalake") == "1.6.6"'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Exercise the Compose stack on synthetic data
        run: |
          python -m pip install uv==0.11.6
          uv run --locked --no-dev python -m scripts.smoke_independent_compose fenix-independent:validation .quality-context
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FRONTEND_CONTEXT_COMMIT }}
          path: .frontend-context
          persist-credentials: false
      - name: Validate the application frontend
        run: |
          npm --prefix .frontend-context ci
          npm --prefix .frontend-context test
          docker build --file .frontend-context/Dockerfile.frontend --tag "fenix-quality:sha-$GITHUB_SHA" .frontend-context
          docker run --rm --network none --add-host backend:127.0.0.1 \
            --read-only --tmpfs /etc/nginx/conf.d --tmpfs /var/cache/nginx --tmpfs /var/run \
            -e BACKEND_PORT=8011 -e NGINX_ENVSUBST_TEMPLATE_DIR=/opt/fenix/templates \
            "fenix-quality:sha-$GITHUB_SHA" nginx -t
      - name: Prepare the tested Live rollout
        id: bundle
        # Activate the integrated stack once, after all validation jobs pass.
        if: |
          github.repository == 'ikervillen/test-runner-deploy' && github.ref == 'refs/heads/develop' &&
          github.run_attempt == '1' &&
          ((github.event_name == 'push' && github.event.before == 'aad276c868863c8d77271aefae194a423d283f5d' &&
            github.event.head_commit.message == 'Deploy integrated Fenix Live AR and coverage') ||
           (github.event_name == 'workflow_dispatch' && inputs.rollout_application))
        run: |
          set -euo pipefail
          mkdir -p bundle
          docker tag fenix-independent:validation "fenix-independent:sha-$GITHUB_SHA"
          docker image save "fenix-independent:sha-$GITHUB_SHA" "fenix-quality:sha-$GITHUB_SHA" | gzip -1 > bundle/image.tar.gz
          echo 'rollout=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.bundle.outputs.rollout == 'true'
        with:
          name: live-image-tar
          path: bundle/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  publish-live:
    needs: [independent-image, gold-native-contracts, contracts-and-delta]
    if: needs.independent-image.outputs.rollout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: live-image-tar
          path: bundle
      - name: Publish the tested image and write its proof
        id: proof
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fenix-independent:sha-$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:independent-sha-$GITHUB_SHA"
          docker image load --input bundle/image.tar.gz
          docker tag "$tag" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$image"
          digest=$(docker image inspect --format '{{json .RepoDigests}}' "$image" |
            jq -er --arg repo "${image%:*}" '
              [.[] | select(startswith($repo + "@sha256:"))]
              | if length == 1 then .[0] else error("Expected one digest from GHCR") end')
          [[ "$digest" =~ ^ghcr\.io/[a-z0-9_./-]+@sha256:[0-9a-f]{64}$ ]]
          jq -n --arg registry_ref "$digest" --arg local_tag "$tag" \
            --arg image_id "$(docker image inspect "$tag" --format '{{.Id}}')" \
            --arg archive_sha256 "$(sha256sum bundle/image.tar.gz | cut -d' ' -f1)" \
            --arg frontend_id "$(docker image inspect "fenix-quality:sha-$GITHUB_SHA" --format '{{.Id}}')" \
            '{$registry_ref,$local_tag,$image_id,$archive_sha256,$frontend_id}' > bundle/image.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: $digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-image-proof
          path: bundle/image.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
    outputs:
      digest: ${{ steps.proof.outputs.digest }}

  rollout-live:
    needs: publish-live
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    environment: develop
    timeout-minutes: 90
    concurrency:
      group: ingesta-deploy-${{ github.repository }}-develop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: live-image-*
          path: ${{ runner.temp }}/fenix-image-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
      - name: Deploy the compatible Live services
        shell: powershell
        env:
          FENIX_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          FENIX_DOCKER_CONTEXT: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          IMAGE: ${{ needs.publish-live.outputs.digest }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "fenix-image-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          try {
            $mode = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              @{ ApplicationOnly = $true }
            } else {
              @{ ApplicationLive = $true; IncludeIngestion = $true }
            }
            ./scripts/update_independent_workers.ps1 @mode -Bundle $bundle `
              -Image $env:IMAGE -Revision $env:GITHUB_SHA -GoldRevision $env:GOLD_CONTEXT_COMMIT
          } finally {
            Remove-Item -LiteralPath (Join-Path $bundle 'image.tar.gz'), (Join-Path $bundle 'image.json') -ErrorAction SilentlyContinue
          }
