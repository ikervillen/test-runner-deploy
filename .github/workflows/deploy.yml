name: Verify bounded ingestion (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          $active = Get-Content -LiteralPath (Join-Path $site.state_root 'develop/active.json') -Raw | ConvertFrom-Json
          $active | Select-Object commit,image,container,volume,channel | ConvertTo-Json
          $ctx = $site.docker_context
          docker --context $ctx container inspect --format '{{json .State}}' $active.container
          if ($LASTEXITCODE -ne 0) { throw 'New worker absent' }
          $tablesPath = '\\wsl$\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes\fenix-aiala-develop\_data\silver\AIALA'
          Write-Output ('WINDOWS_TABLE_PATH='+$tablesPath+' EXISTS='+(Test-Path -LiteralPath $tablesPath))
          if (Test-Path -LiteralPath $tablesPath) { Get-ChildItem -LiteralPath $tablesPath -Directory | Select-Object -ExpandProperty Name }
          docker --context $ctx container inspect --format 'RESTART_COUNT={{.RestartCount}} MEMORY_LIMIT={{.HostConfig.Memory}} SWAP_LIMIT={{.HostConfig.MemorySwap}}' $active.container
          docker --context $ctx stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' $active.container
          $metrics = "import base64;exec(base64.b64decode(''))"
          docker --context $ctx exec $active.container python -c $metrics
          docker --context $ctx volume inspect $active.volume --format '{{json .Labels}}'
          if ($LASTEXITCODE -ne 0) { throw 'Persistent volume absent' }
          $code = "import base64;exec(base64.b64decode(''))"
          $out = docker --context $ctx run --rm --pull never --network none --read-only --cap-drop ALL --memory 512m --cpus 1 --tmpfs '/tmp:rw,nosuid,size=64m' --env "INGESTA_OBSERVED_COMMIT=$($active.commit)" --env "INGESTA_OBSERVED_ACTIVATION=$($active.token)" --mount "type=volume,src=$($active.volume),dst=/lake,readonly" --entrypoint python $active.image -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Lake metadata inventory failed' }
          $target = Join-Path $env:RUNNER_TEMP 'bounded-pilot-inventory.json'
          [IO.File]::WriteAllText($target, ($out -join "`n"), [Text.UTF8Encoding]::new($false))
          Write-Output $out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bounded-pilot-inventory
          path: ${{ runner.temp }}/bounded-pilot-inventory.json
          retention-days: 14
