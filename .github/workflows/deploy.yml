name: Ingesta Delta Lake
on:
  push:
    branches: [main, develop]
    paths-ignore:
      # Airflow and Gold orchestration. The ingestion worker image does not contain these files.
      - .github/workflows/deploy.yml
      - deployment/airflow-develop.ps1
      - deployment/gold_site.py
      - deployment/compose.gold.develop.yaml
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, diagnose, gold-prepare, gold-enable-export, gold-airflow-status, gold-data-status, gold-airflow, gold-activate, gold-verify, docker-inventory, docker-cleanup, rollback, inspect, compact, trial, reformulate, rebuild-index, compact-associations, release-tested-onprem]
        default: validate
        description: 'validate: CI/imagen; diagnose: Docker/montaje; docker-inventory: recursos de develop; rollback: release previa'
      validated_run:
        type: string
        required: false
        description: Successful Windows/Linux test run for the same application source
      gold_images:
        type: string
        required: false
        description: Comma-separated image IDs from a completed Gold build (Airflow, backend, frontend)
      remove_backup:
        type: boolean
        default: false
        description: 'compact: retirar las copias antiguas solo despuÃ©s de validar cada sustituciÃ³n'

permissions:
  contents: read

env:
  GOLD_CONTEXT_COMMIT: 33dcd94ebcf1fbdede0e765684652bded8ccbf4a
  GOLD_SOURCE_COMMIT: 7fe9688f829576986fd01c812a07071342b114ab

jobs:
  control-maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && contains(fromJSON('["inspect","compact","trial","reformulate","rebuild-index","compact-associations"]'), inputs.operation)
    uses: ./.github/workflows/maintenance.yml
    with:
      operation: ${{ inputs.operation }}
      remove_backup: ${{ inputs.remove_backup }}

  contracts-and-delta:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'validate'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned uv
        shell: pwsh
        run: |
          "UV_PROJECT_ENVIRONMENT=$env:RUNNER_TEMP/ingesta-delta-venv" >> $env:GITHUB_ENV
          python -m pip install uv==0.11.6
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Contracts and real Delta transactions on synthetic inputs
        run: uv run --locked python -m pytest --cov=ingesta_delta_lake --cov=deployment --cov-report=term-missing --cov-fail-under=85

  image:
    needs: contracts-and-delta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.ref == 'refs/heads/develop'
        with:
          ref: ${{ env.GOLD_CONTEXT_COMMIT }}
          path: .gold-context
          persist-credentials: false
      - name: Build the immutable candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          echo "CANDIDATE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            test "$(cat .gold-context/GOLD_REVISION)" = "$GOLD_SOURCE_COMMIT"
            echo "dockerfile=Dockerfile.gold-export" >> "$GITHUB_OUTPUT"
            echo "contexts=quality=.gold-context" >> "$GITHUB_OUTPUT"
            echo "INGESTA_GOLD_EXPORT=1" >> "$GITHUB_ENV"
          else
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "INGESTA_GOLD_EXPORT=0" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ steps.candidate.outputs.dockerfile }}
          build-contexts: ${{ steps.candidate.outputs.contexts }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.candidate.outputs.image }}
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            BRANCH=${{ github.ref_name }}
            GOLD_REVISION=${{ env.GOLD_SOURCE_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the final image without operational mounts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=512m \
            --env INGESTA_GOLD_EXPORT \
            "$CANDIDATE" self-test | tee release/image-tests.json
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            "$CANDIDATE" describe > release/contracts.json
          docker image inspect "$CANDIDATE" > release/image.json
          docker run --rm --network none --read-only --entrypoint python "$CANDIDATE" \
            -c 'import importlib.metadata as m,json; print(json.dumps(sorted((d.metadata["Name"],d.version) for d in m.distributions())))' \
            > release/packages.json
      - name: Exercise real Docker activation and graceful update
        shell: bash
        run: |
          set -euo pipefail
          python3 -m deployment.smoke --image "$CANDIDATE" | tee release/docker-lifecycle.json
      - name: Publish tested image
        id: publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$CANDIDATE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > release/image-reference.txt
          docker logout ghcr.io
      - name: Preserve validation evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: ${{ github.ref_name }}
    concurrency:
      group: ingesta-deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy exact tested image to the branch environment
        shell: powershell
        env:
          INGESTA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGESTA_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY `
            -Branch $env:RELEASE_BRANCH -SitePath $env:DEPLOY_SITE `
            -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          ./scripts/deploy.ps1 -Site $site -Branch $env:RELEASE_BRANCH `
            -Image $env:RELEASE_IMAGE -Commit $env:RELEASE_SHA -RunUrl $env:RELEASE_RUN

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: ${{ github.ref_name }}
    concurrency:
      group: ingesta-deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore previous compatible release without reverting data
        shell: powershell
        env:
          INGESTA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGESTA_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY `
            -Branch $env:RELEASE_BRANCH -SitePath $env:DEPLOY_SITE `
            -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          ./scripts/deploy.ps1 -Site $site -Branch $env:RELEASE_BRANCH `
            -RunUrl $env:RELEASE_RUN -Mode Rollback

  docker-inventory:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && contains(fromJSON('["docker-inventory","docker-cleanup"]'), inputs.operation)
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: develop
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Report Docker resources for develop
        shell: powershell
        env:
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          DOCKER_OPERATION: ${{ inputs.operation }}
        run: |
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY `
            -Branch develop -SitePath $env:DEPLOY_SITE `
            -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          $arguments = @('-m', 'deployment.inventory', '--site', $site, '--branch', 'develop')
          if ($env:DOCKER_OPERATION -eq 'docker-cleanup') { $arguments += '--remove-retired' }
          python @arguments

  gold-prepare:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["gold-prepare","gold-enable-export","gold-airflow-status","gold-data-status"]'), inputs.operation) && github.ref == 'refs/heads/develop'
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: develop
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Inspect Gold and prepare Airflow volumes
        shell: powershell
        env:
          GOLD_OPERATION: ${{ inputs.operation }}
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
        run: |
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY `
            -Branch develop -SitePath $env:DEPLOY_SITE `
            -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          $arguments = @('-m', 'deployment.gold_site', '--site', $site)
          if ($env:GOLD_OPERATION -eq 'gold-enable-export') { $arguments += '--enable-export' }
          if ($env:GOLD_OPERATION -eq 'gold-airflow-status') { $arguments += '--airflow-status' }
          if ($env:GOLD_OPERATION -eq 'gold-data-status') { $arguments += '--data-status' }
          python @arguments

  gold-images:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["gold-airflow","gold-activate"]'), inputs.operation) && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.publish.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.GOLD_CONTEXT_COMMIT }}
          path: .gold-context
          persist-credentials: false
      - name: Build Gold images and publish them
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < .gold-context/GOLD_REVISION)" = "$GOLD_SOURCE_COMMIT"
          owner="${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pushed_ref() {
            local remote="$1"
            local push_log sha name
            push_log="$(docker push "$remote" 2>&1 | tee /dev/stderr)"
            sha="$(printf '%s\n' "$push_log" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -1)"
            if [[ ! "$sha" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "La imagen $remote no publicó digest" >&2
              exit 1
            fi
            name="${remote%%:*}"
            printf '%s\n' "${name}@${sha}"
          }
          publish() {
            local remote="$1"
            shift
            docker build --platform linux/amd64 -t "$remote" "$@" >&2
            pushed_ref "$remote"
          }
          airflow="$(publish "ghcr.io/${owner}:gold-airflow-${GOLD_SOURCE_COMMIT}" -f .gold-context/orchestration/airflow/Dockerfile .gold-context)"
          backend="$(publish "ghcr.io/${owner}:gold-backend-${GOLD_SOURCE_COMMIT}" -f .gold-context/backend/Dockerfile .gold-context)"
          frontend="$(publish "ghcr.io/${owner}:gold-frontend-${GOLD_SOURCE_COMMIT}" -f .gold-context/Dockerfile.frontend .gold-context)"
          postgres_remote="ghcr.io/${owner}:gold-postgres-16"
          docker pull postgres:16 >&2
          docker tag postgres:16 "$postgres_remote"
          postgres="$(pushed_ref "$postgres_remote")"
          echo "images=${airflow},${backend},${frontend},${postgres}" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  gold-airflow:
    needs: gold-images
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      (
        (inputs.operation == 'gold-verify' && needs.gold-images.result == 'skipped') ||
        (contains(fromJSON('["gold-airflow","gold-activate"]'), inputs.operation) && needs.gold-images.result == 'success')
      )
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: develop
    permissions:
      contents: read
      packages: read
    concurrency:
      group: gold-develop-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 1080
    env:
      GOLD_CONTEXT_COMMIT: 33dcd94ebcf1fbdede0e765684652bded8ccbf4a
      GOLD_SOURCE_COMMIT: 7fe9688f829576986fd01c812a07071342b114ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pull published Gold images and start the Airflow control plane
        shell: powershell
        env:
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          AIRFLOW_DB_PASSWORD: ${{ secrets.GOLD_AIRFLOW_DB_PASSWORD }}
          AIRFLOW_FERNET_KEY: ${{ secrets.GOLD_AIRFLOW_FERNET_KEY }}
          AIRFLOW_JWT_SECRET: ${{ secrets.GOLD_AIRFLOW_JWT_SECRET }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.GOLD_AIRFLOW_ADMIN_PASSWORD }}
          GOLD_CATALOGS_GZIP_B64: ${{ secrets.GOLD_CATALOGS_GZIP_B64 }}
          GOLD_CONTEXT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLD_OPERATION: ${{ inputs.operation }}
          GOLD_EXISTING_IMAGES: ${{ inputs.gold_images }}
          GOLD_REGISTRY_IMAGES: ${{ needs.gold-images.outputs.images }}
          INGESTA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGESTA_REGISTRY_USER: ${{ github.actor }}
          DOCKER_BUILDKIT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonRoot = Join-Path ([IO.Path]::GetTempPath()) 'fenix-python-3.12.10'
          $python = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
            New-Item -ItemType Directory -Force -Path $pythonRoot | Out-Null
            $zip = Join-Path $pythonRoot 'python-embed.zip'
            Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force
            Remove-Item -LiteralPath $zip -Force
            $pth = Get-ChildItem -LiteralPath $pythonRoot -Filter 'python*._pth' | Select-Object -First 1
            $lines = @(Get-Content -LiteralPath $pth.FullName)
            $lines += (Get-Location).Path
            $lines += 'import site'
            Set-Content -LiteralPath $pth.FullName -Value $lines -Encoding ascii
          }
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY `
            -Branch develop -SitePath $env:DEPLOY_SITE `
            -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          $contextPath = Join-Path $env:RUNNER_TEMP "gold-${{ github.run_id }}-${{ github.run_attempt }}"
          $env:PATH = "$pythonRoot;$env:PATH"
          & $python -m deployment.gold_context $contextPath
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo obtener el contexto fijado.' }
          ./deployment/airflow-develop.ps1 -Site $site -GoldContext $contextPath `
            -Activate:($env:GOLD_OPERATION -eq 'gold-activate') -VerifyOnly:($env:GOLD_OPERATION -eq 'gold-verify')

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'diagnose'
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Inspect Docker and input directory without running ingestion
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker context show
          docker info --format '{{.ID}} {{.OSType}} {{.Architecture}}'
          if ($LASTEXITCODE -ne 0) { throw 'Motor Docker no disponible para la cuenta del runner.' }
          $image = 'python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e'
          $check = 'from pathlib import Path; import json,sys; v={o:(Path("/input")/o).is_dir() for o in ["AV21","AV22","AV23","AV31","AV32"]}; print(json.dumps(v)); sys.exit(0 if all(v.values()) else 1)'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($check))
          $check = "import base64;exec(base64.b64decode('$encoded'))"
          $found = $false
          foreach ($binding in @('C:/DataSharing/Fenix', '/mnt/c/DataSharing/Fenix')) {
            Write-Output "Comprobando montaje de solo lectura: $binding"
            docker run --rm --network none --read-only --cap-drop ALL `
              --mount "type=bind,src=$binding,dst=/input,readonly" `
              --entrypoint python $image -c $check
            if ($LASTEXITCODE -eq 0) { Write-Output "INPUT_BIND_OK=$binding"; $found = $true; break }
          }
          if (-not $found) { throw 'No se han encontrado los cinco orÃ­genes en el montaje.' }

  release-tested-onprem:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release-tested-onprem' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ${{ fromJSON(vars.INGESTA_RUNNER_LABELS || '["self-hosted","Windows","X64"]') }}
    environment: develop
    timeout-minutes: 60
    concurrency:
      group: ingesta-deploy-${{ github.repository }}-develop
      cancel-in-progress: false
    env:
      REVISION: ${{ github.sha }}
      VALIDATED_RUN: ${{ inputs.validated_run }}
      INGESTA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INGESTA_REGISTRY_USER: ${{ github.actor }}
    steps:
      - name: Require successful Linux and Windows tests for current develop HEAD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REVISION -notmatch '^[a-f0-9]{40}$' -or $env:VALIDATED_RUN -notmatch '^\d+$') { throw 'Invalid release identity' }
          $headers = @{ Authorization = "Bearer $env:INGESTA_GITHUB_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $head = Invoke-RestMethod "$api/git/ref/heads/develop" -Headers $headers
          $run = Invoke-RestMethod "$api/actions/runs/$env:VALIDATED_RUN" -Headers $headers
          if ($head.object.sha -ne $env:REVISION -or $run.head_branch -ne 'develop' -or $run.event -ne 'push') { throw 'Release is not current develop HEAD' }
          if ($run.head_sha -ne $env:REVISION) {
            # Reuse tests only while this workflow is the sole changed file.
            # Application, dependencies, Dockerfile and deployment code must be identical.
            $comparison = Invoke-RestMethod "$api/compare/$($run.head_sha)...$env:REVISION" -Headers $headers
            if ($comparison.status -ne 'ahead' -or $comparison.total_commits -gt 10 -or @($comparison.files).Count -ne 1 -or $comparison.files[0].filename -ne '.github/workflows/deploy.yml') { throw 'Application source differs from tested revision' }
          }
          $jobs = Invoke-RestMethod "$api/actions/runs/$env:VALIDATED_RUN/jobs?filter=latest" -Headers $headers
          foreach ($os in @('ubuntu-latest', 'windows-latest')) {
            $matches = @($jobs.jobs | Where-Object { $_.name -eq "contracts-and-delta ($os)" -and $_.conclusion -eq 'success' })
            if ($matches.Count -ne 1) { throw "Missing successful tests for $os" }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build and exercise the exact tested source without operational mounts
        id: image
        shell: powershell
        env:
          GOLD_CONTEXT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLower()):sha-$env:REVISION"
          $dockerDirectory = Split-Path (Get-Command docker).Source
          $buildxCandidates = @(
            (Join-Path (Split-Path $dockerDirectory) 'cli-plugins/docker-buildx.exe'),
            (Join-Path $env:ProgramFiles 'Docker/Docker/resources/cli-plugins/docker-buildx.exe')
          )
          $buildx = $buildxCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $buildx) { throw 'Docker Desktop BuildKit plugin is unavailable' }
          $goldContext = Join-Path $env:RUNNER_TEMP "gold-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m deployment.gold_context $goldContext
          if ($LASTEXITCODE -ne 0) { throw 'Gold context identity differs' }
          & $buildx build --load --platform linux/amd64 --provenance=false --build-arg "REVISION=$env:REVISION" --build-arg "SOURCE=https://github.com/$env:GITHUB_REPOSITORY" --build-arg 'BRANCH=develop' --build-arg "GOLD_REVISION=$env:GOLD_SOURCE_COMMIT" --build-context "quality=$goldContext" -f Dockerfile.gold-export -t $image .
          if ($LASTEXITCODE -ne 0) { throw 'Image build failed' }
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=512m --env INGESTA_GOLD_EXPORT=1 $image self-test
          if ($LASTEXITCODE -ne 0) { throw 'Final image self-test failed' }
          $originalConfig = $env:DOCKER_CONFIG
          $buildContext = docker context show
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine Docker context' }
          $sourceConfig = if ($originalConfig) { $originalConfig } else { Join-Path $env:USERPROFILE '.docker' }
          $temporaryParent = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $temporaryConfig = Join-Path $temporaryParent ('fenix-release-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temporaryConfig | Out-Null
          try {
            $contexts = Join-Path $sourceConfig 'contexts'
            if (Test-Path -LiteralPath $contexts) { Copy-Item -LiteralPath $contexts -Destination $temporaryConfig -Recurse }
            $env:DOCKER_CONFIG = $temporaryConfig
            python deployment/registry.py
            if ($LASTEXITCODE -ne 0) { throw 'Registry authentication failed' }
            docker --context $buildContext push --platform linux/amd64 $image
            if ($LASTEXITCODE -ne 0) { throw 'Image publication failed' }
            $digest = docker --context $buildContext image inspect --format '{{index .RepoDigests 0}}' $image
            if ($LASTEXITCODE -ne 0 -or $digest -notmatch '@sha256:[a-f0-9]{64}$') { throw 'Missing immutable image digest' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image=$digest`n", [Text.UTF8Encoding]::new($false))
          }
          finally {
            $env:DOCKER_CONFIG = $originalConfig
            $target = [IO.Path]::GetFullPath($temporaryConfig)
            if (-not $target.StartsWith($temporaryParent + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe temporary cleanup path' }
            Remove-Item -LiteralPath $target -Recurse -Force
          }
      - name: Activate the image using the existing graceful deployment protocol
        shell: powershell
        env:
          DEPLOY_SITE: ${{ vars.INGESTA_SITE_CONFIG }}
          INPUT_BIND: ${{ vars.INGESTA_INPUT_BIND }}
          DOCKER_CONTEXT_NAME: ${{ vars.INGESTA_DOCKER_CONTEXT }}
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          $ErrorActionPreference = 'Stop'
          $site = ./scripts/prepare_site.ps1 -Repository $env:GITHUB_REPOSITORY -Branch develop -SitePath $env:DEPLOY_SITE -InputBind $env:INPUT_BIND -DockerContext $env:DOCKER_CONTEXT_NAME
          ./scripts/deploy.ps1 -Site $site -Branch develop -Image $env:RELEASE_IMAGE -Commit $env:REVISION -RunUrl "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
