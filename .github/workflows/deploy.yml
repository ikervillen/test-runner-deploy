name: Pilot capacity and input inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker --context desktop-linux info --format 'ENGINE_MEMORY={{.MemTotal}} ENGINE_CPUS={{.NCPU}}'
          docker --context desktop-linux ps -a --format '{{.Names}} {{.Status}}' --filter label=es.fenix.ingesta.role=worker
          docker --context desktop-linux volume inspect fenix-aiala-develop --format '{{json .Labels}}'
          if ($LASTEXITCODE -ne 0) { throw 'Persistent volume missing' }
          $script = "import base64;exec(base64.b64decode(''))"
          docker --context desktop-linux run --rm --pull never --network none --read-only --cap-drop ALL --memory 256m --cpus 1 --mount 'type=bind,src=C:/DataSharing/Fenix,dst=/input,readonly' --entrypoint python 'python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e' -c $script
          if ($LASTEXITCODE -ne 0) { throw 'Read-only input inventory failed' }
