name: Inspect develop storage before requested reset
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker --context desktop-linux info --format 'ENGINE={{.ID}} MEMORY={{.MemTotal}} TYPE={{.OSType}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker engine unavailable' }
          docker --context desktop-linux ps -a --format '{{.Names}} {{.Status}}' --filter volume=fenix-aiala-develop
          $volumes = docker --context desktop-linux volume ls --format '{{.Name}}'
          if ($volumes -contains 'fenix-aiala-develop') { docker --context desktop-linux volume inspect fenix-aiala-develop }
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          Write-Output ('STATE_ROOT='+$site.state_root)
          $active = Join-Path $site.state_root 'develop/active.json'
          if (Test-Path -LiteralPath $active) { Get-Content -LiteralPath $active -Raw }
          foreach ($p in @('\\wsl$\docker-desktop', '\\wsl$\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes', '\\wsl$\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes\fenix-aiala-develop\_data')) {
            Write-Output ($p+' EXISTS='+(Test-Path -LiteralPath $p))
          }
          Get-ChildItem -LiteralPath 'C:\DataSharing\Fenix' -Directory | Select-Object -ExpandProperty Name
