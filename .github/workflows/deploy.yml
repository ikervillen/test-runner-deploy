name: ZC start evidence (read only)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: string
        default: diagnose
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 8
    steps:
      - name: Read hot-side evidence without altering ingestion
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workers = @(docker ps -q --filter 'label=es.fenix.ingesta.role=worker' --filter 'label=es.fenix.ingesta.channel=develop')
          if ($workers.Count -ne 1) { throw 'Expected one active ingestion worker' }
          $active = (docker inspect $workers[0] | ConvertFrom-Json)[0]
          $inputMount = @($active.Mounts | Where-Object { $_.Destination -eq '/input' })
          if ($inputMount.Count -ne 1) { throw 'Expected one input mount' }
          $code = "import base64;exec(base64.b64decode(''))"
          $report = Join-Path $env:RUNNER_TEMP 'zc-start-evidence.json'
          $result = & docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 0.5 --mount "type=bind,src=$($inputMount[0].Source),dst=/input,readonly" --entrypoint python $active.Image -B -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Read-only evidence audit failed' }
          [IO.File]::WriteAllText($report, ($result -join "`n"), (New-Object Text.UTF8Encoding($false)))
          $doc = Get-Content $report -Raw | ConvertFrom-Json
          $doc | Select-Object checked_at_utc,industrial_mutations | ConvertTo-Json
          $doc.lines | Select-Object line,hot_files_available,bytes_read | Format-Table
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: zc-start-evidence
          path: ${{ runner.temp }}/zc-start-evidence.json
          retention-days: 7
