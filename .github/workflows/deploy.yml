name: Observe develop pilot (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - name: Inventory input filenames and sizes without reading rows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $code = "import base64;exec(base64.b64decode(''))"
          docker --context desktop-linux run --rm --pull never --network none --read-only --cap-drop ALL --memory 256m --cpus 1 --mount 'type=bind,src=C:/DataSharing/Fenix,dst=/input,readonly' --entrypoint python 'python:3.12.14-slim-bookworm@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e' -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Input inventory failed' }
      - name: Read active release and lake inventory without ingestion
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $siteFile = Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json'
          if (-not (Test-Path -LiteralPath $siteFile)) { Write-Output 'NO_SITE_YET'; exit 0 }
          $site = Get-Content -LiteralPath $siteFile -Raw | ConvertFrom-Json
          $state = Join-Path $site.state_root 'develop'
          Write-Output "DEPLOYMENT_STATE=$state"
          $activeFile = Join-Path $state 'active.json'
          if (-not (Test-Path -LiteralPath $activeFile)) {
            Write-Output 'NO_ACTIVE_RELEASE_YET'
            $journal = Join-Path $state 'transaction.json'
            if (Test-Path -LiteralPath $journal) { Get-Content -LiteralPath $journal -Raw }
            exit 0
          }
          $active = Get-Content -LiteralPath $activeFile -Raw | ConvertFrom-Json
          $active | Select-Object commit,image,container,volume,channel | ConvertTo-Json
          $ctx = $site.docker_context
          docker --context $ctx container inspect --format '{{json .State}}' $active.container
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect deployed worker' }
          docker --context $ctx stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' $active.container
          docker --context $ctx volume inspect --format '{{json .}}' $active.volume
          if ($LASTEXITCODE -ne 0) { throw 'Volume absent; no helper is launched' }
          docker --context $ctx exec $active.container python -m ingesta_delta_lake.runtime health
          $code = "import base64;exec(base64.b64decode(''))"
          $out = docker --context $ctx run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --tmpfs '/tmp:rw,nosuid,size=64m' --mount "type=volume,src=$($active.volume),dst=/lake,readonly" --mount "type=bind,src=$($site.input_bind),dst=/input,readonly" --entrypoint python $active.image -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Read-only inventory failed' }
          $target = Join-Path $env:RUNNER_TEMP 'develop-pilot-inventory.json'
          [IO.File]::WriteAllText($target, ($out -join "`n"), [Text.UTF8Encoding]::new($false))
          Write-Output $out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: develop-pilot-inventory
          path: ${{ runner.temp }}/develop-pilot-inventory.json
          if-no-files-found: warn
          retention-days: 14
