name: Read-only active worker resources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 5
    steps:
      - name: Read worker resources and recent outcomes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker --context desktop-linux stats --no-stream --format '{{json .}}'
          $worker = docker --context desktop-linux ps -q --filter label=es.fenix.ingesta.role=worker --filter label=es.fenix.ingesta.channel=develop
          if (-not $worker -or @($worker).Count -ne 1) { throw 'Expected one worker' }
          docker --context desktop-linux inspect --format '{{json .State}}' $worker
          docker --context desktop-linux logs --tail 15 $worker 2>&1 | ForEach-Object { Write-Output "$_" }
