name: Recreate develop storage (user authorized)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingesta-deploy-ikervillen/test-runner-deploy-develop
  cancel-in-progress: false
jobs:
  reset:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 45d87f2f9ddddbff8475dfb0aede89ba7ed934c9
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Recreate only the explicitly confirmed develop volume
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json'
          $url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python -m deployment.reset_develop --site $site --confirm-volume fenix-aiala-develop --run-url $url
          if ($LASTEXITCODE -ne 0) { throw 'Explicit reset did not complete' }
          docker --context desktop-linux volume inspect fenix-aiala-develop
          $p = '\\wsl$\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes\fenix-aiala-develop\_data'
          Write-Output ($p+' EXISTS='+(Test-Path -LiteralPath $p))
