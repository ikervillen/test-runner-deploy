name: Registry authentication diagnostic (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  server-auth:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compare byte transport and read-only registry access
        shell: powershell
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_USER: ${{ github.actor }}
          PROBE_CONTEXT: desktop-linux
        run: |
          $ErrorActionPreference = 'Stop'
          $check = 'import os,sys,json; b=sys.stdin.buffer.read(); t=os.environ["PROBE_TOKEN"].encode(); print(json.dumps({"pipe_stripped_matches_token":b.strip()==t,"pipe_starts_utf8_bom":b.startswith(bytes([239,187,191])),"pipe_byte_count":len(b),"token_byte_count":len(t)}))'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($check))
          $env:PROBE_TOKEN | python -c "import base64;exec(base64.b64decode('$encoded'))"
          $script = Join-Path $env:RUNNER_TEMP 'fenix-auth-probe.py'
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String(''))
          python $script
          if ($LASTEXITCODE -ne 0) { throw 'Authentication diagnostic failed' }
  hosted-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test same read-only permissions on hosted runner
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_USER: ${{ github.actor }}
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
