name: Recover unwritten initial MIA (offline)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingesta-deploy-ikervillen/test-runner-deploy-develop
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0cf41b58d659965ba4d8ade944a919661762515
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify stopped owner and requeue only provably unwritten initial intent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json'
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python -m deployment.maintenance --site $site --family LISTA_RECH --run-url $runUrl
          if ($LASTEXITCODE -ne 0) { throw 'Offline recovery did not complete; no worker is started' }
