name: Compare Windows and worker CSV visibility (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          $active = Get-Content -LiteralPath (Join-Path $site.state_root 'develop/active.json') -Raw | ConvertFrom-Json
          $ctx = $site.docker_context
          $inspection = docker --context $ctx container inspect $active.container | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Worker absent' }
          $settingsEntry = @($inspection.Config.Env | Where-Object { $_.StartsWith('INGESTA_SETTINGS=') })
          $env:INGESTA_SETTINGS = $settingsEntry[0].Substring('INGESTA_SETTINGS='.Length)
          $hostLines = @()
          foreach ($line in @('AV21','AV22','AV23','AV31','AV32')) {
            $folder = Join-Path 'C:\DataSharing\Fenix' $line
            $files = @(Get-ChildItem -LiteralPath $folder -File -Filter '*.csv')
            $ars = @($files | Where-Object { $_.Name -like '*LISTA_AR*' })
            $hostLines += [pscustomobject]@{ line=$line; folder=$folder; ar_count=$ars.Count; latest_ar=@($ars | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 8 Name,Length,LastWriteTimeUtc); today_ar_names=@($ars | Where-Object { $_.Name -like '20102026_*' -or $_.Name -like '20261020_*' } | Select-Object -ExpandProperty Name); latest_csv=@($files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 5 Name,Length,LastWriteTimeUtc) }
          }
          $hostReport = [pscustomobject]@{ at=(Get-Date).ToString('o'); computer=$env:COMPUTERNAME; site_input=$site.input_bind; active_input=$active.input_bind; mounts=$inspection.Mounts; lines=$hostLines }
          $hostTarget = Join-Path $env:RUNNER_TEMP 'windows-source-visibility.json'
          [IO.File]::WriteAllText($hostTarget, ($hostReport | ConvertTo-Json -Depth 10), [Text.UTF8Encoding]::new($false))
          Write-Output ('HOST_REPORT='+($hostReport | ConvertTo-Json -Depth 10 -Compress))
          $code = "import base64;exec(base64.b64decode(''))"
          $out = docker --context $ctx run --rm --pull never --network none --read-only --cap-drop ALL --memory 256m --cpus 1 --volumes-from "$($active.container):ro" --env INGESTA_SETTINGS --entrypoint python $active.image -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Read-only path diagnostic failed' }
          $target = Join-Path $env:RUNNER_TEMP 'worker-source-visibility.json'
          [IO.File]::WriteAllText($target, ($out -join "`n"), [Text.UTF8Encoding]::new($false))
          Write-Output ('WORKER_REPORT='+($out -join "`n"))
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lista-ar-paths
          path: |
            ${{ runner.temp }}/windows-source-visibility.json
            ${{ runner.temp }}/worker-source-visibility.json
          retention-days: 14
