name: Pilot resources and Windows path verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 5
    steps:
      - name: Adjust only the active develop worker and verify Explorer paths
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'FenixIngesta/deployments/develop'
          $active=Get-Content -LiteralPath (Join-Path $root 'active.json') -Raw | ConvertFrom-Json
          if ($active.commit -ne 'af3360fe33338a23f25fc196dc02c3c5872037a9' -or $active.channel -ne 'develop') { throw 'Unexpected release' }
          $ctx=$active.docker_context
          $state=(& docker --context $ctx container inspect $active.container | ConvertFrom-Json)[0]
          if ($LASTEXITCODE -ne 0 -or $state.Config.Labels.'es.fenix.ingesta.channel' -ne 'develop' -or $state.Config.Labels.'es.fenix.ingesta.role' -ne 'worker' -or -not $state.State.Running) { throw 'Unexpected container' }
          $available=[int64](& docker --context $ctx info --format '{{.MemTotal}}')
          if ($available -lt 7900000000) { throw 'Insufficient Docker VM memory for the pilot adjustment' }
          $receipt=[ordered]@{time=[DateTime]::UtcNow.ToString('o');container=$active.container;commit=$active.commit;engine_memory=$available;before_memory=$state.HostConfig.Memory;before_memory_swap=$state.HostConfig.MemorySwap;target_memory=6442450944;target_memory_swap=8589934592;reason='Measured first-backfill memory pressure at 4GiB; temporary develop-only adjustment';run=$env:GITHUB_RUN_ID}
          if ($state.HostConfig.Memory -eq 4294967296) {
            docker --context $ctx update --memory 6g --memory-swap 8g $active.container
            if ($LASTEXITCODE -ne 0) { throw 'Resource adjustment failed' }
          } elseif ($state.HostConfig.Memory -ne 6442450944) { throw 'Unexpected resource limit; no adjustment' }
          $after=(& docker --context $ctx container inspect $active.container | ConvertFrom-Json)[0]
          $receipt.after_memory=$after.HostConfig.Memory
          $receipt.after_memory_swap=$after.HostConfig.MemorySwap
          $receipt.started_at=$after.State.StartedAt
          $receipt.restart_count=$after.RestartCount
          $receiptPath=Join-Path $root ('pilot-resource-adjustment-'+$env:GITHUB_RUN_ID+'.json')
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $receipt | ConvertTo-Json
          docker --context $ctx stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' $active.container
          Write-Output 'WSL_DISTRIBUTIONS'
          & wsl.exe --list --quiet
          foreach ($candidate in @(
            '\\wsl$\docker-desktop\mnt\docker-desktop-disk\data\docker\volumes\fenix-aiala-develop\_data\silver\AIALA',
            '\\wsl$\docker-desktop-data\data\docker\volumes\fenix-aiala-develop\_data\silver\AIALA',
            '\\wsl$\docker-desktop-data\version-pack-data\community\docker\volumes\fenix-aiala-develop\_data\silver\AIALA',
            '\\wsl$\docker-desktop\var\lib\docker\volumes\fenix-aiala-develop\_data\silver\AIALA'
          )) {
            if (Test-Path -LiteralPath $candidate -PathType Container -ErrorAction SilentlyContinue) {
              Write-Output ('VERIFIED_EXPLORER_PATH='+$candidate)
              Get-ChildItem -LiteralPath $candidate -Directory | Select-Object -ExpandProperty Name
            }
          }
