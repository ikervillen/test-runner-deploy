name: Checkpoint develop before incremental upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 30
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          $active = Get-Content -LiteralPath (Join-Path $site.state_root 'develop/active.json') -Raw | ConvertFrom-Json
          $ctx = $site.docker_context
          if ($active.channel -ne 'develop' -or $active.volume -ne 'fenix-aiala-develop' -or $active.commit -ne '558c1f6ab637c70e64123c3202a7e16735cd4dce') { throw 'Unexpected active release; refuse maintenance' }
          $engine = docker --context $ctx info --format '{{.ID}}'
          if ($LASTEXITCODE -ne 0 -or $engine -ne $active.engine_id) { throw 'Unexpected engine' }
          $inspection = docker --context $ctx container inspect $active.container | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $inspection.Config.Labels.'es.fenix.ingesta.channel' -ne 'develop') { throw 'Unexpected container' }
          $settingsEntry = @($inspection.Config.Env | Where-Object { $_.StartsWith('INGESTA_SETTINGS=') })
          $env:INGESTA_SETTINGS = $settingsEntry[0].Substring('INGESTA_SETTINGS='.Length)
          $env:INGESTA_CHANNEL='develop'
          $env:INGESTA_INSTANCE=$active.instance
          $env:INGESTA_ACTIVATION=$active.token
          $backup = 'fenix-aiala-develop-backup-' + $env:GITHUB_RUN_ID
          if ((docker --context $ctx volume ls -q --filter "name=^$backup`$").Length -gt 0) { throw 'Backup volume already exists' }
          try {
            docker --context $ctx update --restart=no $active.container
            if ($LASTEXITCODE -ne 0) { throw 'Cannot set graceful maintenance policy' }
            if ((docker --context $ctx inspect --format '{{.State.Running}}' $active.container) -eq 'true') {
              docker --context $ctx kill --signal=SIGTERM $active.container
              if ($LASTEXITCODE -ne 0) { throw 'Cannot request graceful stop' }
            }
            $deadline=(Get-Date).AddMinutes(15)
            while ((docker --context $ctx inspect --format '{{.State.Running}}' $active.container) -eq 'true') {
              if ((Get-Date) -gt $deadline) { throw 'No safe boundary reached; never force-kill' }
              Start-Sleep -Seconds 3
            }
            docker --context $ctx run --rm --pull never --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m --memory 512m --cpus 1 --volumes-from "$($active.container):ro" --env INGESTA_SETTINGS --env INGESTA_CHANNEL --env INGESTA_INSTANCE --env INGESTA_ACTIVATION $active.image check
            if ($LASTEXITCODE -ne 0) { throw 'Old image did not confirm a clean checkpoint' }
            docker --context $ctx volume create --label 'es.fenix.ingesta.role=backup' --label 'es.fenix.ingesta.channel=develop' --label "es.fenix.ingesta.source=$($active.volume)" $backup
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create independent backup volume' }
            $code="import base64;exec(base64.b64decode(''))"
            $out=docker --context $ctx run --rm --pull never --network none --read-only --memory 256m --cpus 1 --mount "type=volume,src=$($active.volume),dst=/lake,readonly" --mount "type=volume,src=$backup,dst=/backup" --entrypoint python $active.image -c $code
            if ($LASTEXITCODE -ne 0) { throw 'Backup verification failed' }
            $receipt=[pscustomobject]@{ status='CHECKPOINTED_AND_BACKED_UP'; at=(Get-Date).ToString('o'); volume=$active.volume; backup_volume=$backup; stopped_container=$active.container; commit=$active.commit; backup=($out -join "`n" | ConvertFrom-Json) }
            $target=Join-Path $env:RUNNER_TEMP 'pre-incremental-checkpoint.json'
            [IO.File]::WriteAllText($target,($receipt | ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
            Write-Output ($receipt | ConvertTo-Json -Depth 6)
          } catch {
            docker --context $ctx update --restart=unless-stopped $active.container
            if ((docker --context $ctx inspect --format '{{.State.Running}}' $active.container) -eq 'false') { docker --context $ctx start $active.container }
            throw
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pre-incremental-checkpoint
          path: ${{ runner.temp }}/pre-incremental-checkpoint.json
          retention-days: 30
