name: Stop unsafe backfill retries at a cooperative boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-stop:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 5
    steps:
      - name: Disable restart and request SIGTERM without forced termination
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'FenixIngesta/deployments/develop'
          $active=Get-Content -LiteralPath (Join-Path $root 'active.json') -Raw | ConvertFrom-Json
          if ($active.commit -ne 'af3360fe33338a23f25fc196dc02c3c5872037a9' -or $active.channel -ne 'develop') { throw 'Unexpected release' }
          $ctx=$active.docker_context
          $state=(& docker --context $ctx container inspect $active.container | ConvertFrom-Json)[0]
          if ($LASTEXITCODE -ne 0 -or $state.Config.Labels.'es.fenix.ingesta.channel' -ne 'develop' -or $state.Config.Labels.'es.fenix.ingesta.role' -ne 'worker') { throw 'Unexpected container' }
          docker --context $ctx update --restart=no $active.container
          if ($LASTEXITCODE -ne 0) { throw 'Could not disable automatic restart' }
          if ($state.State.Running) {
            docker --context $ctx kill --signal SIGTERM $active.container
            if ($LASTEXITCODE -ne 0) { throw 'Could not request cooperative stop' }
          }
          $after=(& docker --context $ctx container inspect $active.container | ConvertFrom-Json)[0]
          $receipt=[ordered]@{time=[DateTime]::UtcNow.ToString('o');container=$active.container;commit=$active.commit;reason='Initial MIA backlog approaches 6GiB memory and swaps heavily; disable automatic retry and request graceful stop pending bounded batches';running=$after.State.Running;oom_killed=$after.State.OOMKilled;restart_policy=$after.HostConfig.RestartPolicy.Name;restart_count=$after.RestartCount;run=$env:GITHUB_RUN_ID}
          [IO.File]::WriteAllText((Join-Path $root ('pilot-cooperative-stop-'+$env:GITHUB_RUN_ID+'.json')), ($receipt | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          $receipt | ConvertTo-Json
          docker --context $ctx container inspect --format '{{json .State}}' $active.container
