name: Diagnose LISTA_AR (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          $active = Get-Content -LiteralPath (Join-Path $site.state_root 'develop/active.json') -Raw | ConvertFrom-Json
          $ctx = $site.docker_context
          docker --context $ctx container inspect --format '{{json .State}}' $active.container
          if ($LASTEXITCODE -ne 0) { throw 'Worker absent' }
          $inspection = docker --context $ctx container inspect $active.container | ConvertFrom-Json
          $settingsEntry = @($inspection.Config.Env | Where-Object { $_.StartsWith('INGESTA_SETTINGS=') })
          if ($settingsEntry.Count -ne 1) { throw 'Settings absent or ambiguous' }
          $env:INGESTA_SETTINGS = $settingsEntry[0].Substring('INGESTA_SETTINGS='.Length)
          $code = "import base64;exec(base64.b64decode(''))"
          $out = docker --context $ctx run --rm --pull never --network none --read-only --cap-drop ALL --memory 512m --cpus 1 --tmpfs '/tmp:rw,nosuid,size=64m' --env INGESTA_SETTINGS --mount "type=volume,src=$($active.volume),dst=/lake,readonly" --mount "type=bind,src=$($active.input_bind),dst=/input,readonly" --entrypoint python $active.image -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Read-only diagnostic failed' }
          $target = Join-Path $env:RUNNER_TEMP 'lista-ar-diagnostic.json'
          [IO.File]::WriteAllText($target, ($out -join "`n"), [Text.UTF8Encoding]::new($false))
          Write-Output $out
          docker --context $ctx logs --tail 16 $active.container
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lista-ar-diagnostic
          path: ${{ runner.temp }}/lista-ar-diagnostic.json
          retention-days: 14
