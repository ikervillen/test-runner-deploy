name: Inspect failed recovery space (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, fenix-ingesta]
    timeout-minutes: 10
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-PSDrive -Name C | Select-Object Name,Used,Free | ConvertTo-Json
          $site = Get-Content -LiteralPath (Join-Path $env:LOCALAPPDATA 'FenixIngesta/site-develop.json') -Raw | ConvertFrom-Json
          $active = Get-Content -LiteralPath (Join-Path $site.state_root 'develop/active.json') -Raw | ConvertFrom-Json
          docker --context desktop-linux volume inspect $active.volume --format '{{json .Labels}}'
          if ($LASTEXITCODE -ne 0) { throw 'Persistent volume absent' }
          $code = "import base64;exec(base64.b64decode(''))"
          docker --context desktop-linux run --rm --pull never --network none --read-only --cap-drop ALL --memory 512m --tmpfs '/tmp:rw,nosuid,size=512m' --mount "type=volume,src=$($active.volume),dst=/lake,readonly" --entrypoint python $active.image -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Read-only inspection failed' }
