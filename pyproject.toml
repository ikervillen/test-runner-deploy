[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ingesta-delta-lake"
version = "0.1.0"
description = "Ingesta independiente y auditable de Fenix a Delta Lake"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deltalake==1.6.6",
  "pyarrow>=21,<24",
  "portalocker>=3.2,<4",
]

[project.scripts]
ingesta-delta = "ingesta_delta_lake.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingesta_delta_lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["ingesta_delta_lake"]
branch = true

[tool.coverage.report]
show_missing = true

