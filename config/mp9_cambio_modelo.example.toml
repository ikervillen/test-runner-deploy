# Ensayo local: las fechas Fenix se conservan sin zona (Delta timestamp_ntz).
# Política productiva de zona/DST pendiente; no convertir estas horas a UTC.
environment = "test"
plant = "AIALA"
family = "MP9_CAMBIO_MODELO"
input_root = "C:/Ingesta_Delta_Lake_ensayo/incoming"
bronze_root = "C:/Ingesta_Delta_Lake_ensayo/bronze"
silver_root = "C:/Ingesta_Delta_Lake_ensayo/silver"
control_root = "C:/Ingesta_Delta_Lake_ensayo/control"
encoding = "cp1252"
timestamp_policy = "local_naive_test_v1"
# Opcional: umbral de ensayo para escalar dependencias, no una regla de cierre.
# Sin configurar, se conserva y comunica antigüedad sin escalado automático.
pending_review_after_hours = 24.0
stable_wait_seconds = 0.2
capture_attempts = 3
max_file_bytes = 67108864

[sources]
AV21 = "AV21"
AV22 = "AV22"
AV23 = "AV23"
AV31 = "AV31"
AV32 = "AV32"
