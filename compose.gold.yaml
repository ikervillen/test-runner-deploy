services:
  publisher:
    build:
      context: .
      dockerfile: gold/Dockerfile
    command: ["watch", "--settings", "/config/settings.json"]
    volumes:
      - type: bind
        source: ${HOST_CONFIRMED_SILVER_ROOT:?Set confirmed Silver publication root}
        target: /silver
        read_only: true
      - type: bind
        source: ${HOST_GOLD_ROOT:?Set independent writable Gold root}
        target: /gold
      - type: bind
        source: ${HOST_GOLD_CONFIG_ROOT:?Set Gold configuration directory}
        target: /config
        read_only: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=128m,noexec,nosuid,nodev]
    mem_limit: ${PUBLISHER_MEMORY_LIMIT:-2g}
    cpus: ${PUBLISHER_CPU_LIMIT:-2.0}
    stop_grace_period: 5m
    environment:
      RAYON_NUM_THREADS: "2"
      TOKIO_WORKER_THREADS: "2"
      OMP_NUM_THREADS: "1"
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ["${APP_ENV_FILE:-.env}"]
    environment:
      APP_DATA_BACKEND: gold
      APP_DATA_ROOT: /gold
      APP_GOLD_ROOT: /gold
      APP_WEB_CONCURRENCY: "1"
      APP_SCORE_QUERY_MAX_CONCURRENCY: "1"
    volumes:
      - type: bind
        source: ${HOST_GOLD_ROOT:?Set Gold root}
        target: /gold
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp:size=128m,noexec,nosuid,nodev]
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    stop_grace_period: 3m
    ports: ["127.0.0.1:${BACKEND_PORT:-8001}:8001"]
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
      - /var/run:size=8m,noexec,nosuid,nodev
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5174}:8080"]
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
