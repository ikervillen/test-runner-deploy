# Final overlay for the protected develop deployment on the Fenix Docker engine.
x-gold: &gold
  type: volume
  source: ingesta-develop
  target: /gold
  volume:
    subpath: gold

services:
  airflow-dag-processor:
    healthcheck:
      timeout: 45s
  backend:
    image: calidad-serie-develop-backend:${AIRFLOW_IMAGE_TAG:?Set Gold source revision}
    volumes:
      - <<: *gold
        read_only: true
  airflow-scheduler:
    healthcheck:
      timeout: 45s
    volumes:
      - *gold
      - type: volume
        source: gold-config
        target: /config
        read_only: true
      - type: volume
        source: gold-backup
        target: /backup
  publisher:
    volumes:
      - *gold
      - type: volume
        source: gold-config
        target: /config
        read_only: true
  frontend:
    image: calidad-serie-develop-frontend:${AIRFLOW_IMAGE_TAG:?Set Gold source revision}

volumes:
  gold-config:
  gold-backup:
